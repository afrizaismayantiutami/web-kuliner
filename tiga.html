
<<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Masakan Nusantara</title>
  <style>
    body {
      background: url("makanan.jpg");
      background-size: cover;
      background-position: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #B3541E;
      display: inline-block;
      position: relative;
      animation: zigzag 2s infinite alternate;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    @keyframes zigzag {
      0% { transform: translateX(0px); }
      25% { transform: translateX(20px); }
      50% { transform: translateX(-20px); }
      75% { transform: translateX(20px); }
      100% { transform: translateX(0px); }
    }
  </style>
</head>
<body>
  <h1>Selamat Datang di Masakan Nusantara 🍜</h1>
  <p>Pilih salah satu jenis masakan dari menu kiri untuk melihat detailnya.</p>
</body>
</html>
